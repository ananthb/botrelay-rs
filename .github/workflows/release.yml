name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Reuses ci.yml rather than restating its steps, so the checks a tag
  # must pass are the same ones a PR passes, by construction.
  #
  # Ordering matters more than it looks: if this fails, `release` is
  # skipped and no GitHub Release is created. v0.2.0 is what the other
  # order costs -- tag pushed, Release published, `cargo publish`
  # rejected, and a version stranded that could only be abandoned.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      # Lets crates-io-auth-action mint a short-lived OIDC token at
      # publish time, scoped to this repo + workflow. No long-lived
      # secret to rotate, and nothing to expire.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish botrelay
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
