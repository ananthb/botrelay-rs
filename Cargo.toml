[package]
name = "botrelay"
version = "0.1.0"
edition = "2021"
description = "Forward content to Telegram and Discord bots and route replies back — reusable primitives for Cloudflare Workers"
license = "AGPL-3.0"
repository = "https://github.com/ananthb/botrelay-rs"

[dependencies]
worker = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
